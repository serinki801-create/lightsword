name: build-kstest

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile C objects
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p build
          for f in $(find Sources -type f \( -name '*.c' -o -name '*.m' \)); do
            echo "CC $f"
            xcrun clang -c "$f" -o "build/$(echo "$f" | tr '/' '_').o" \
              -target arm64-apple-ios16.0 \
              -isysroot "$SDK" \
              -O2 -Wno-everything \
              -ISources/Core -ISources/Diag -ISources/Probes -ISources/Kernel -ISources/Legacy
          done
          ls build/*.o

      - name: Compile Swift and link
        run: |
          set -e
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          xcrun swiftc \
            -target arm64-apple-ios16.0 \
            -sdk "$SDK" \
            -O \
            -parse-as-library \
            -module-name srk801 \
            -import-objc-header Bridging-Header.h \
            -Xcc -ISources/Core -Xcc -ISources/Diag -Xcc -ISources/Probes -Xcc -ISources/Kernel -Xcc -ISources/Legacy \
            $(find Sources/App -name '*.swift') build/*.o \
            -framework Foundation \
            -framework UIKit \
            -framework SwiftUI \
            -framework IOKit \
            -framework CoreFoundation \
            -o build/srk801

      - name: Package ipa
        run: |
          set -e
          rm -rf Payload srk801.ipa
          mkdir -p Payload/srk801.app
          cp build/srk801 Payload/srk801.app/srk801
          chmod +x Payload/srk801.app/srk801
          cp Info.plist Payload/srk801.app/Info.plist
          printf 'APPL????' > Payload/srk801.app/PkgInfo
          zip -qr srk801.ipa Payload
          echo "=== IPA STRUCTURE ==="
          unzip -l srk801.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: srk801-ipa
          path: srk801.ipa
